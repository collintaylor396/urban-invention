    function b64ToBytes(value) {
      var bin = atob(value);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) {
        out[i] = bin.charCodeAt(i);
      }
      return out;
    }

    function resolveDocumentOrigin() {
      if (window.__sxDocumentOrigin) return window.__sxDocumentOrigin;
      if (window.location && window.location.protocol === "blob:") {
        var match = String(window.location.href).match(/^blob:(https?:\/\/[^/]+)/i);
        if (match) return match[1];
      }
      if (window.location && window.location.origin && window.location.origin !== "null") {
        return window.location.origin;
      }
      return "";

    function prepareHtml(html) {
      var pageOrigin = resolveDocumentOrigin();
      if (pageOrigin && html.indexOf("<head") !== -1 && html.indexOf("<base", html.indexOf("<head")) === -1) {
        html = html.replace(/<head([^>]*)>/i, '$&<base href="' + pageOrigin + '">');
